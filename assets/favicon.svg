<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Metallic Steel Silver/Blue Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b0c4de"/>
      <stop offset="35%" stop-color="#8aa4c2"/>
      <stop offset="70%" stop-color="#6783a4"/>
      <stop offset="100%" stop-color="#4e6888"/>
    </linearGradient>

    <!-- Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#091322" flood-opacity="0.5"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Top Chevron V Shape -->
    <path d="M 170 110 
             L 256 172 
             L 342 110 
             L 342 148 
             L 256 210 
             L 170 148 Z" 
          fill="url(#metalGrad)" 
          stroke="#7995b5" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Main M Body Shape -->
    <!-- Left Wing Outer -->
    <path d="M 170 168
             L 106 214
             L 106 338
             L 208 404
             L 208 274
             L 172 250
             L 172 328
             L 138 304
             L 138 234
             L 170 210
             L 256 270
             L 342 210
             L 374 234
             L 374 304
             L 340 328
             L 340 250
             L 304 274
             L 304 404
             L 406 338
             L 406 214
             L 342 168
             L 256 228 Z" 
          fill="url(#metalGrad)" 
          stroke="#7995b5" 
          stroke-width="3" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>
</svg>
